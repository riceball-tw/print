# Site-wide configuration.
#
# The `file()` loader treats each top-level key as a collection entry `id`.
# Keeping a single `site` key makes this collection a singleton:
#
#   const config = await getEntry('config', 'site');
site:
  brand:
    name: Print
    description: A minimal Astro site.
    copyright: © 2026 Print
    socials:
      - name: GitHub
        url: https://github.com/withastro
      - name: X
        url: https://x.com/astrodotbuild
  navigation:
    - name: Home
      url: /
    - name: Posts
      url: /posts
    - name: About
      url: /about
